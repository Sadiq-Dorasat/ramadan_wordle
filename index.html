<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramadan Wordle - Islamic Word Game</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%23c9b458' d='M283.211 512c78.962 0 151.079-35.925 198.857-94.792 7.068-8.708-.639-21.43-11.562-19.35-124.203 23.654-238.262-71.576-238.262-196.954 0-72.222 38.662-138.635 101.498-174.394 9.686-5.512 7.25-20.197-3.756-22.23A258.156 258.156 0 0 0 283.211 0c-141.309 0-256 114.511-256 256 0 141.309 114.511 256 256 256z'/%3E%3C/svg%3E" type="image/svg+xml">
    <style>
        /* Prevent double-tap zoom but allow pinch zoom */
        * {
            touch-action: manipulation;
        }
    </style>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ramadan Wordle</h1>
            <div class="subtitle">Guess the Islamic 5-letter word</div>
            <div class="header-buttons">
                <button id="statistics-button" class="icon-button" aria-label="Statistics">
                    <i class="fas fa-chart-bar"></i>
                </button>
            </div>
        </header>

        <div id="loading-indicator" style="display: none; text-align: center; margin: 10px 0;">
            <p>Loading word list... <span id="word-count">0</span> words</p>
        </div>

        <div id="game-container">
            <div id="board-container">
                <div id="board"></div>
            </div>

            <div id="keyboard-container">
                <div class="keyboard-row">
                    <button data-key="q">q</button>
                    <button data-key="w">w</button>
                    <button data-key="e">e</button>
                    <button data-key="r">r</button>
                    <button data-key="t">t</button>
                    <button data-key="y">y</button>
                    <button data-key="u">u</button>
                    <button data-key="i">i</button>
                    <button data-key="o">o</button>
                    <button data-key="p">p</button>
                </div>
                <div class="keyboard-row">
                    <div class="spacer half"></div>
                    <button data-key="a">a</button>
                    <button data-key="s">s</button>
                    <button data-key="d">d</button>
                    <button data-key="f">f</button>
                    <button data-key="g">g</button>
                    <button data-key="h">h</button>
                    <button data-key="j">j</button>
                    <button data-key="k">k</button>
                    <button data-key="l">l</button>
                    <div class="spacer half"></div>
                </div>
                <div class="keyboard-row">
                    <button data-key="enter" class="wide-button">Enter</button>
                    <button data-key="z">z</button>
                    <button data-key="x">x</button>
                    <button data-key="c">c</button>
                    <button data-key="v">v</button>
                    <button data-key="b">b</button>
                    <button data-key="n">n</button>
                    <button data-key="m">m</button>
                    <button data-key="del" class="wide-button"><i class="fas fa-backspace"></i></button>
                </div>
            </div>
        </div>

        <div id="message-container"></div>

        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2 id="modal-title"></h2>
                <p id="modal-message"></p>
                <div id="word-definition"></div>
                <button id="play-again">Play Again</button>
            </div>
        </div>

        <footer>
            <p>A Ramadan-themed word game inspired by Wordle</p>
            <p>Made with ❤️ for the Muslim community</p>
        </footer>
    </div>

    <script src="js/words.js"></script>
    <script src="js/dictionary.js"></script>
    <script src="js/wordlist.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
